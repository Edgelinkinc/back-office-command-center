<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1B5C">
<meta name="robots" content="noindex, nofollow">
<title>Back Office Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#4A1B5C;--plum2:#2E0F3A;--mag:#E20074;--mag-d:#9C0050;--lav:#F1EBF7;--lav2:#FAF7FC;--line:#E2D8EA;--line2:#F0EAF4;--ink:#2A1A33;--mute:#5E4E68;--mute2:#6F6278;--bg:#F6F4F8;--amb:#FFF1D6;--amb-t:#7A4A00;--red:#FDE8E7;--red-t:#A3211A;--blu:#E6EEFA;--blu-t:#1B4F94;--grn:#E3F3E9;--grn-t:#1E6B3E;--gry:#EEEAF1;--gry-t:#4E4356;--pink:#FCE4F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Montserrat,'Segoe UI',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum)}
.sr{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
/* header */
.top{background:var(--plum);color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:1px;line-height:1;white-space:nowrap;color:#fff;text-decoration:none}
.dia{width:15px;height:15px;background:var(--mag);transform:rotate(45deg);border-radius:3px;margin:0 3px}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:16px;cursor:pointer}
.tb{height:36px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.tb option{color:var(--ink)}
.search{flex:1 1 180px;min-width:0}
.search input{width:100%;height:36px;border-radius:8px;border:0;padding:0 12px;font-size:13px}
.save{font-size:12px;font-weight:600;white-space:nowrap;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.12)}
.save.err{background:#FDE8E7;color:var(--red-t)}
.save.ing{background:rgba(255,255,255,.2)}
/* buttons */
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid #CDBBDA;background:#fff;color:var(--plum);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--lav2)}
.btn.p{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn.m{background:var(--mag);color:#fff;border-color:var(--mag)}
.btn.w{background:#fff;color:var(--plum);border-color:#fff}
.btn.g{background:var(--grn-t);color:#fff;border-color:var(--grn-t)}
.btn.r{color:var(--red-t);border-color:#F2C4C1}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.xs{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--plum);font-weight:600;font-size:12px;cursor:pointer;text-decoration:underline}
/* layout */
.wrap{display:flex;flex-wrap:wrap;gap:16px;padding:14px 16px;align-items:flex-start}
.nav{flex:0 0 184px;display:flex;flex-direction:column;gap:1px;font-size:13px;position:sticky;top:66px}
.nav button{display:flex;justify-content:space-between;align-items:center;min-height:34px;padding:0 10px;border-radius:7px;color:var(--ink);font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:#EDE5F4}
.nav button.on{background:var(--plum);color:#fff}
.n{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:#EDE5F4;color:var(--plum)}
.on .n{background:rgba(255,255,255,.2);color:#fff}
.n.mag{background:var(--pink);color:var(--mag-d)}.n.red{background:var(--red);color:var(--red-t)}.n.amb{background:var(--amb);color:var(--amb-t)}
.sep{height:1px;background:var(--line);margin:6px 0}
.main{flex:999 1 560px;min-width:0}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.colL{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:10px}
.colR{flex:1 1 260px;min-width:0;max-width:340px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--lav);font-size:12px;font-weight:700;color:var(--plum);letter-spacing:.3px;text-transform:uppercase}
.gh span,.gh .sub{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mute)}
.gh.dk{background:var(--plum);color:#fff}.gh.dk span{color:#E8DDF0}
.gh.mg{background:var(--pink);color:var(--mag-d)}.gh.mg span{color:var(--mag-d)}
.card.mg{border-color:var(--mag)}
.empty{padding:14px 12px;color:var(--mute);font-size:13px}
h1.pg{margin:0;font-size:20px;color:var(--plum)}
.theme{font-size:12px;font-weight:700;color:var(--mag-d);background:var(--pink);padding:3px 10px;border-radius:99px}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:6px 6px 6px 14px}
.stat{display:flex;align-items:baseline;gap:5px;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.stat b{font-size:18px}
.quick{flex:1 1 220px;min-width:0;display:flex;gap:6px}
.quick input{flex:1 1 auto;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:var(--lav2)}
/* task rows */
.r{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--line2);font-size:14px;cursor:pointer}
.r:hover{background:var(--lav2)}
.r.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:#FFF1D6}100%{background:transparent}}
.r input[type=checkbox]{width:17px;height:17px;accent-color:var(--plum);flex:0 0 auto;margin:0;cursor:pointer}
.r .ti{flex:1 1 auto;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.done .ti{color:#8A7E92;text-decoration:line-through}
.r.ro{cursor:default}
.c{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;background:var(--lav);color:var(--plum);display:inline-block}
.c.amb{background:var(--amb);color:var(--amb-t)}.c.red{background:var(--red);color:var(--red-t)}.c.blu{background:var(--blu);color:var(--blu-t)}.c.grn{background:var(--grn);color:var(--grn-t)}.c.gry{background:var(--gry);color:var(--gry-t)}.c.plum{background:var(--plum);color:#fff}.c.mag{background:var(--pink);color:var(--mag-d)}
.pdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:#B9A8C6}
.pdot.High{background:#C0362C}.pdot.Low{background:#E2D8EA}
.meta{font-size:12px;color:var(--mute2);white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:0 1 auto;justify-content:flex-end}
/* schedule */
.s{display:flex;gap:10px;padding:7px 12px;border-top:1px solid var(--line2);font-size:13px;align-items:flex-start;cursor:pointer}
.s:hover{background:var(--lav2)}
.s .t{flex:0 0 58px;font-weight:700;color:var(--plum);font-size:12px;padding-top:1px}
.s .w{flex:1 1 auto;min-width:0}
.s .w b{font-weight:600;display:block}
.s .w i{font-style:normal;font-size:12px;color:var(--mute2)}
.s.past .t{color:#8A7E92}
.s.priv{background:#F4F1F6}
.nowline{border-top:2px solid var(--mag);position:relative}
.nowline span{position:absolute;right:8px;top:-9px;background:var(--mag);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
/* week */
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1100px}
.wcol{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.wcol.off{background:#F4F1F6;border-style:dashed}
.wcol.today{border:2px solid var(--mag)}
.wcol .dh{padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.wcol .dh b{color:var(--plum)}
.wcol .dh div{font-size:11px;font-weight:600;color:var(--mute)}
.wit{margin:6px 6px 0;padding:6px 8px;border-radius:7px;font-size:12px;line-height:1.3;cursor:pointer;border:1px solid var(--line);background:#fff;overflow:hidden;text-overflow:ellipsis}
.wit .tt{display:block;font-weight:700;font-size:11px}
.wit.call{background:var(--plum);color:#fff;border-color:var(--plum)}
.wit.blk{background:var(--lav);color:var(--plum);border-color:var(--lav)}
.wit.cf{background:var(--amb);color:var(--amb-t);border-color:var(--amb)}
.wit.pv{background:var(--gry);color:var(--gry-t);border-color:var(--gry)}
.wit.dn{opacity:.55;text-decoration:line-through}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(46,15,58,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(74,27,92,.18)}
.dhd{padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line2)}
.dbody{flex:1 1 auto;overflow:auto}
.dft{padding:10px 16px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;background:var(--lav2)}
.sec{padding:12px 16px;border-top:1px solid var(--line2)}
.sec:first-child{border-top:0}
.h{font-size:12px;font-weight:700;color:var(--plum);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h span{text-transform:none;letter-spacing:0;color:var(--mute);font-weight:600}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 40px rgba(74,27,92,.25)}
.modal.sm{width:min(440px,calc(100% - 24px))}
.mhd{background:var(--plum);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mhd h2{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:1px;line-height:1}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--amb);color:var(--amb-t)}
.pill.ok{background:var(--grn);color:var(--grn-t)}.pill.bad{background:var(--red);color:var(--red-t)}
.mbody{padding:12px 16px;overflow:auto;flex:1 1 auto}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label,.lbl{font-size:11px;font-weight:600;color:var(--mute)}
.in{height:34px;border:1px solid #D9CCE4;border-radius:8px;padding:0 8px;font-size:13px;background:#fff;width:100%;min-width:0}
textarea.in{height:auto;padding:8px;resize:vertical;min-height:70px}
.in.bad{border-color:var(--red-t);background:#FFF8F7}
.in[readonly]{background:#F4F1F6;color:var(--gry-t)}
.ttl{font-size:19px;font-weight:700;color:var(--plum);border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;width:100%;background:transparent}
.ttl:hover,.ttl:focus{border-color:#D9CCE4;background:#fff}
.err{color:var(--red-t);font-size:12px;font-weight:600}
.warn{background:#FFF8EC;border:1px solid #F0D9A8;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.bad-box{background:var(--red);border:1px solid #F2C4C1;border-radius:8px;padding:8px 10px;font-size:13px;color:#7A1B15}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:32px;padding:0 12px;border-radius:99px;border:1px solid #CDBBDA;background:#fff;color:var(--plum);font-weight:600;font-size:12px;cursor:pointer}
.opt.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.dayb{width:40px;height:40px;border-radius:9px;border:1px solid #CDBBDA;background:#fff;color:var(--plum);font-weight:700;font-size:12px;cursor:pointer}
.dayb.on{background:var(--plum);color:#fff;border-color:var(--plum)}
/* subtasks */
.st{display:flex;align-items:center;gap:6px;min-height:30px;font-size:13px;flex-wrap:wrap}
.st.l1{font-weight:600;border-top:1px solid var(--line2);padding:4px 0}
.st.l2{padding-left:26px}.st.l3{padding-left:52px;font-size:12px}
.st input[type=checkbox]{width:16px;height:16px;accent-color:var(--plum);margin:0;flex:0 0 auto}
.st .stt{flex:1 1 160px;min-width:0;border:1px solid transparent;border-radius:6px;padding:3px 5px;background:transparent;font-weight:inherit;font-size:inherit}
.st .stt:hover,.st .stt:focus{border-color:#D9CCE4;background:#fff}
.st.dn .stt{color:#8A7E92;text-decoration:line-through}
.who{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 6px 2px 2px;border-radius:99px;background:#F4F1F6;color:var(--plum);white-space:nowrap}
.who i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--plum);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.who button{border:0;background:none;color:var(--mute);cursor:pointer;padding:0 2px;font-size:12px}
.rec{font-size:11px;color:var(--grn-t);font-weight:600;white-space:nowrap}
.inv{font-size:11px;font-weight:700;color:var(--blu-t);background:var(--blu);padding:2px 7px;border-radius:5px;white-space:nowrap}
.add{font-size:11px;font-weight:600;color:var(--plum);border:1px dashed #CDBBDA;border-radius:99px;padding:2px 8px;background:#fff;cursor:pointer;white-space:nowrap}
.ico{border:0;background:none;color:var(--mute2);cursor:pointer;padding:2px 4px;font-size:13px}
.ico:hover{color:var(--red-t)}
.pick{border:1px solid #CDBBDA;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(74,27,92,.16);padding:8px;display:flex;flex-direction:column;gap:4px;max-width:420px;margin:4px 0}
.pick .po{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.pick .po:hover{background:var(--lav)}
.chipbox{min-height:34px;border:1px solid #D9CCE4;border-radius:8px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#fff}
.chipbox input{flex:1 1 140px;border:0;height:24px;font-size:13px;min-width:0;outline:none}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--mute);font-weight:700;padding:7px 10px;background:var(--lav2);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.scrollx{overflow-x:auto}
/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:#FF9ACB;font-weight:700;cursor:pointer}
/* org */
.node{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.node:hover{background:var(--lav2)}.node.on{background:var(--lav);box-shadow:inset 3px 0 0 var(--plum)}
.av{width:30px;height:30px;border-radius:50%;background:#EDE5F4;color:var(--plum);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.br{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}
.nm{flex:1 1 auto;min-width:0}.nm b{display:block;font-size:13px}.nm i{font-style:normal;font-size:11px;color:var(--mute2)}
/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap;background:var(--plum2)}
.login .l{flex:1 1 420px;background:var(--plum);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.login .r2{flex:1 1 420px;background:var(--bg);padding:48px 24px;display:flex;align-items:center;justify-content:center}
.login h1{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(44px,7vw,64px);letter-spacing:1.5px;line-height:.95}
.ms{height:52px;width:100%;border-radius:10px;border:0;background:var(--plum);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.feat{display:flex;gap:10px;font-size:14px;color:#EBDDF3}.feat b{color:#fff;display:block}
.tick{width:22px;height:22px;border-radius:50%;background:rgba(226,0,116,.25);color:#FF7DBA;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
/* mobile */
.tabbar{display:none}
@media (max-width:820px){
  .nav{display:none;position:fixed;top:0;left:0;bottom:0;width:260px;background:#fff;z-index:45;padding:16px 10px;box-shadow:12px 0 32px rgba(74,27,92,.2);overflow:auto}
  .nav.open{display:flex}
  .colR{max-width:none}
  .top .hidem{display:none}
  .wrap{padding:10px 10px 90px}
  .grid2{grid-template-columns:1fr}
  .fgrid,.fgrid.c3,.fgrid.c4{grid-template-columns:1fr 1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1 1 0;min-height:56px;border:0;background:none;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .tabbar button.on{color:var(--plum)}
  .fab{position:fixed;right:12px;bottom:70px;z-index:31;display:flex;gap:8px}
  .fab .btn{height:46px;border-radius:99px;box-shadow:0 6px 16px rgba(74,27,92,.25)}
  .r{padding:10px 12px}
  .r input[type=checkbox]{width:22px;height:22px}
  .r{flex-wrap:wrap}
  .r .ti{white-space:normal;flex:1 1 60%}
  .r .chips{flex:1 1 100%;justify-content:flex-start;padding-left:44px}
  .logo{font-size:19px}
  .r .chips .meta{display:none}
}
@media (min-width:821px){.fab{display:none}.mobonly{display:none}}
@media (max-width:480px){.fgrid,.fgrid.c3,.fgrid.c4{grid-template-columns:1fr}.span2{grid-column:auto}}

</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>

<script>
/* Back Office Command Center — business rules.
   Pure ES5, no DOM, no network. Everything date-related works on
   America/New_York business dates stored as 'YYYY-MM-DD' strings. */
var BOCCRules = (function () {
  'use strict';
  var TZ = 'America/New_York';
  var DAY_MS = 86400000;
  var DEFAULT_WORKDAYS = '0111110'; // Sun..Sat

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // Business date/time in New York for an instant.
  function nyNow(d) {
    d = d || new Date();
    var f = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false

/* Actions, boot. ES5. */
function rec(list, id) {
  if (list === 'BOCC_Tasks') { return S.tasks[id]; }
  var arr = { BOCC_Templates: S.templates, BOCC_People: S.people, BOCC_Contacts: S.contacts, BOCC_Notes: S.notes, BOCC_SharedNotes: S.shared, BOCC_Raises: S.raises }[list] || [];
  for (var i = 0; i < arr.length; i++) { if (String(arr[i]._id) === String(id)) { return arr[i]; } }
  return null;
}
function nyToIso(date, time) {
  var a = date.split('-'), t = (time || '12:00').split(':');
  var guess = Date.UTC(+a[0], +a[1] - 1, +a[2], +t[0], +t[1]) + 4 * 3600000, i;
  for (i = 0; i < 3; i++) {
    var n = R.nyNow(new Date(guess));
    var diff = (R.daysBetween(n.date, date) * 1440) + ((+t[0]) * 60 + (+t[1]) - n.minutes);
    if (!diff) { break; }
    guess += diff * 60000;
  }
  return new Date(guess).toISOString();
}

}

  if (field === 'Status' && value === 'Completed') { tryComplete(t, false); return; }

  if (field === 'PlannedDate') {

}

    LinkedTaskKey: '', LinkedNodeId: '', WantsFollowUp: false, NextAction: '', FollowUpDate: '' };
  if (!ctx.taskId) {
    var d = latestDraft();
    if (d) { S.modal = { type: 'log', f: d.f, draftId: d.draftId, state: 'Draft', draftAt: fmtStamp(d.at) }; render(); toast('Continuing your unsaved conversation draft.'); return; }
  }
  if (ctx.taskId) {
    var t = findTask(ctx.taskId);
    if (t) {
      var go = function (tt) {
        f.LinkedTaskKey = tt.TaskKey; f.Title = titleOf(tt);
        f.People = copy(tt.WithPeople || []);
        if (ctx.node) { var n = R.findNode(tt.Subtasks || [], ctx.node); if (n) { f.LinkedNodeId = n.id; f.Title = n.title; f.People = copy(n.with || []); } }

        if (tt.Kind === 'Call' && tt.PlannedDate !== now.date) { f.date = tt.PlannedDate; f.time = tt.StartTime || '12:00'; }
        S.modal = { type: 'log', f: f, draftId: draftId, state: 'Unsaved' }; render();
      };

    }

}

}
